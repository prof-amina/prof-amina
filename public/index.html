<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5532F">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Prof Amina</title>
<style>
  :root {
    --bg: #FBF5EC; --card: #FFFFFF; --ink: #2B2420; --muted: #7A6E66;
    --terracotta: #B5532F; --terracotta-dark: #8E3E21; --saffron: #E8A33D;
    --teal: #1F6F6B; --teal-light: #E3F0EE; --line: #EADFD2; --red: #D33B2C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
    display: flex; flex-direction: column;
  }
  .ar { font-family: "Noto Naskh Arabic", "Noto Sans Arabic", system-ui, sans-serif; direction: rtl; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
    background: var(--terracotta); color: #fff;
  }
  header h1 { font-size: 22px; margin: 0; flex: 1; font-weight: 700; }
  header button {
    background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 14px;
    font-size: 22px; width: 48px; height: 48px;
  }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.on { display: flex; }

  #code { justify-content: center; padding: 28px; gap: 16px; text-align: center; }
  #code input {
    font-size: 30px; text-align: center; padding: 16px; border-radius: 18px;
    border: 2px solid var(--line); background: #fff; letter-spacing: 4px;
  }
  .btn { font-size: 22px; font-weight: 700; padding: 18px; border: 0; border-radius: 18px; background: var(--teal); color: #fff; }
  .err { color: var(--red); min-height: 1.4em; }

  #topics { overflow-y: auto; padding: 18px; }
  .hello { text-align: center; margin: 6px 0 18px; }
  .hello .fr { font-size: 24px; font-weight: 700; }
  .hello .ar { font-size: 26px; color: var(--terracotta-dark); margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .topic {
    background: var(--card); border: 2px solid var(--line); border-radius: 22px;
    padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    font: inherit; color: inherit; min-height: 150px; justify-content: center;
  }
  .topic:active { transform: scale(.97); background: var(--teal-light); }
  .topic .emo { font-size: 46px; line-height: 1; }
  .topic .fr { font-size: 18px; font-weight: 700; }
  .topic .ar { font-size: 20px; color: var(--muted); }
  .topic.wide { grid-column: 1 / -1; min-height: 110px; }

  /* Conversation */
  #talk { min-height: 0; }
  .stage { display: flex; flex-direction: column; align-items: center; padding: 22px 18px 8px; gap: 14px; }
  .orb {
    width: 168px; height: 168px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #F3C27A, var(--saffron) 45%, var(--terracotta) 100%);
    display: flex; align-items: center; justify-content: center; font-size: 64px;
    box-shadow: 0 10px 30px rgba(181,83,47,.25);
    transition: transform .25s ease;
  }
  .orb.idle { filter: grayscale(.85); opacity: .6; }
  .orb.connecting { animation: breathe 1.6s ease-in-out infinite; filter: grayscale(.4); }
  .orb.listening { animation: listen 1.4s ease-in-out infinite; }
  .orb.speaking { animation: talk .5s ease-in-out infinite alternate; }
  .orb.user { background: radial-gradient(circle at 35% 30%, #7FC4BE, var(--teal) 70%); animation: listen .8s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(.92); } }
  @keyframes listen { 0%,100% { box-shadow: 0 0 0 0 rgba(31,111,107,.35); } 50% { box-shadow: 0 0 0 22px rgba(31,111,107,0); } }
  @keyframes talk { from { transform: scale(1); } to { transform: scale(1.08); } }
  #status { font-size: 20px; text-align: center; min-height: 3em; }
  #status .ar { display: block; font-size: 22px; color: var(--terracotta-dark); }

  #log { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 88%; padding: 10px 14px; border-radius: 18px; font-size: 18px; line-height: 1.45; white-space: pre-wrap; }
  .me { align-self: flex-end; background: var(--teal); color: #fff; border-bottom-right-radius: 6px; }
  .prof { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 6px; }

  .controls { padding: 12px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
  #callBtn {
    min-width: 260px; padding: 22px 28px; border: 0; border-radius: 999px;
    font-size: 22px; font-weight: 800; color: #fff; background: var(--teal);
    box-shadow: 0 8px 22px rgba(31,111,107,.3);
  }
  #callBtn .ar { display: block; font-size: 22px; font-weight: 700; }
  #callBtn.hang { background: var(--red); box-shadow: 0 8px 22px rgba(211,59,44,.3); }
  #callBtn:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <button id="back" aria-label="Retour" style="visibility:hidden">←</button>
  <h1 id="title">Prof Amina</h1>
  <button id="restart" aria-label="Recommencer le thème" style="visibility:hidden">↺</button>
</header>

<section class="screen" id="code">
  <div style="font-size:60px">🔑</div>
  <div style="font-size:20px">Code d'accès<br><span class="ar" style="font-size:22px">دخلي الكود</span></div>
  <input id="codeInput" inputmode="numeric" autocomplete="off">
  <button class="btn" id="codeBtn">OK</button>
  <div class="err" id="codeErr"></div>
</section>

<section class="screen" id="topics">
  <div class="hello">
    <div class="fr">Bonjour ! On apprend quoi aujourd'hui ?</div>
    <div class="ar">السلام! شنو بغيتي تتعلمي اليوم؟</div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section class="screen" id="talk">
  <div class="stage">
    <div class="orb idle" id="orb">👩🏽‍🏫</div>
    <div id="status"></div>
  </div>
  <div id="log" aria-live="polite"></div>
  <div class="controls">
    <button id="callBtn"></button>
  </div>
</section>

<audio id="remote" autoplay playsinline></audio>

<script>
const TOPICS = [
  { id: "presentation", emo: "👋", fr: "Me présenter", ar: "نعرّف بنفسي" },
  { id: "courses", emo: "🛒", fr: "Les courses", ar: "التقضية" },
  { id: "medecin", emo: "🩺", fr: "Le médecin", ar: "الطبيب" },
  { id: "transports", emo: "🚌", fr: "Le bus", ar: "الطوبيس" },
  { id: "administration", emo: "📄", fr: "Les papiers", ar: "الأوراق" },
  { id: "chiffres", emo: "🔢", fr: "Les chiffres", ar: "الأرقام" },
  { id: "libre", emo: "💬", fr: "Discuter", ar: "نهضرو شوية", wide: true },
];
const IDLE_LIMIT_MS = 2 * 60 * 1000; // raccroche tout seul après 2 min sans parole

const $ = (id) => document.getElementById(id);
const state = { code: localStorage.getItem("code") || "", topic: null, pc: null, dc: null, stream: null, idleTimer: null, live: false };

// ---------- utilitaires ----------
function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
  const inTalk = id === "talk";
  $("back").style.visibility = inTalk ? "visible" : "hidden";
  $("restart").style.visibility = inTalk ? "visible" : "hidden";
  if (!inTalk) $("title").textContent = "Prof Amina";
}
function setStatus(fr, ar) {
  $("status").innerHTML = "";
  const a = document.createElement("span"); a.textContent = fr; $("status").append(a);
  if (ar) { const b = document.createElement("span"); b.className = "ar"; b.textContent = ar; $("status").append(b); }
}
function setOrb(mode) { $("orb").className = "orb " + mode; }
function setCallBtn(live, disabled = false) {
  const b = $("callBtn");
  b.disabled = disabled;
  b.classList.toggle("hang", live);
  b.innerHTML = live
    ? `📞 Raccrocher<span class="ar">سالينا</span>`
    : `▶️ Commencer<span class="ar">يالاه نبداو</span>`;
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), "x-access-code": state.code } });
  if (r.status === 401) { localStorage.removeItem("code"); state.code = ""; hangUp(); show("code"); throw new Error("code"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r;
}

// ---------- historique (gardé sur le téléphone, un par thème) ----------
const histKey = () => "hist_" + state.topic;
const loadHist = () => { try { return JSON.parse(localStorage.getItem(histKey()) || "[]"); } catch { return []; } };
function pushHist(role, text) {
  const h = loadHist(); h.push({ role, text }); localStorage.setItem(histKey(), JSON.stringify(h.slice(-60)));
}
function addBubble(role, text) {
  if (!text || !text.trim()) return;
  const d = document.createElement("div");
  d.className = "bubble " + (role === "user" ? "me" : "prof");
  d.dir = "auto"; d.textContent = text.trim();
  $("log").append(d); d.scrollIntoView({ behavior: "smooth", block: "end" });
}

// ---------- minuterie d'inactivité ----------
function bumpIdle() {
  clearTimeout(state.idleTimer);
  if (state.live) state.idleTimer = setTimeout(() => {
    hangUp();
    setStatus("Pause automatique. Appuie sur Commencer pour continuer.", "وقفنا شوية. ورّكي على يالاه نبداو باش نكملو");
  }, IDLE_LIMIT_MS);
}

// ---------- appel en temps réel ----------
async function startCall() {
  setCallBtn(true, true);
  setOrb("connecting");
  setStatus("Connexion…", "كنتاصلو…");
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch {
    setOrb("idle"); setCallBtn(false);
    setStatus("Autorise le micro dans les réglages.", "خصك تسمحي للميكرو");
    return;
  }
  try {
    const hist = loadHist();
    const r = await api("/api/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: state.topic, history: hist.slice(-20) }),
    });
    const { value } = await r.json();

    const pc = new RTCPeerConnection();
    state.pc = pc;
    pc.ontrack = (e) => { $("remote").srcObject = e.streams[0]; };
    pc.addTrack(state.stream.getTracks()[0], state.stream);
    pc.onconnectionstatechange = () => {
      if (["failed", "disconnected"].includes(pc.connectionState) && state.live) {
        hangUp(); setStatus("La connexion a été coupée. Réessaie.", "تقطع الاتصال، عاودي");
      }
    };

    const dc = pc.createDataChannel("oai-events");
    state.dc = dc;
    dc.onmessage = (e) => onEvent(JSON.parse(e.data));
    dc.onopen = () => {
      state.live = true;
      setCallBtn(true);
      setOrb("speaking");
      setStatus("Amina parle…", "أمينة كتهضر…");
      // Amina commence la conversation
      dc.send(JSON.stringify({ type: "response.create" }));
      bumpIdle();
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const sdpRes = await fetch("https://api.openai.com/v1/realtime/calls", {
      method: "POST",
      body: offer.sdp,
      headers: { Authorization: `Bearer ${value}`, "Content-Type": "application/sdp" },
    });
    if (!sdpRes.ok) throw new Error("WebRTC " + sdpRes.status + " " + (await sdpRes.text()).slice(0, 200));
    await pc.setRemoteDescription({ type: "answer", sdp: await sdpRes.text() });
  } catch (e) {
    console.error(e);
    hangUp();
    if (e.message !== "code") {
      setStatus("Impossible de se connecter. Réessaie.", "ما قدرناش نتاصلو، عاودي");
      const s = document.createElement("small");
      s.style.cssText = "display:block;color:#999;font-size:12px;margin-top:6px;word-break:break-word";
      s.textContent = String(e.message || e).slice(0, 200);
      $("status").append(s);
    }
  }
}

function hangUp() {
  state.live = false;
  clearTimeout(state.idleTimer);
  try { state.dc && state.dc.close(); } catch {}
  try { state.pc && state.pc.close(); } catch {}
  if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
  state.pc = state.dc = state.stream = null;
  $("remote").srcObject = null;
  setOrb("idle");
  setCallBtn(false);
  setStatus("Appuie sur Commencer pour parler avec Amina", "ورّكي على يالاه نبداو باش تهضري مع أمينة");
}

function onEvent(ev) {
  switch (ev.type) {
    case "input_audio_buffer.speech_started":
      bumpIdle(); setOrb("user"); setStatus("Je t'écoute…", "كنسمعك…");
      break;
    case "input_audio_buffer.speech_stopped":
      setOrb("listening"); setStatus("…", "");
      break;
    case "output_audio_buffer.started":
    case "response.created":
      bumpIdle(); setOrb("speaking"); setStatus("Amina parle…", "أمينة كتهضر…");
      break;
    case "output_audio_buffer.stopped":
    case "output_audio_buffer.cleared":
      bumpIdle(); setOrb("listening"); setStatus("À toi ! Parle quand tu veux.", "دابا نتي، هضري");
      break;
    case "conversation.item.input_audio_transcription.completed":
      if (ev.transcript) { addBubble("user", ev.transcript); pushHist("user", ev.transcript); }
      break;
    case "response.output_audio_transcript.done":
    case "response.audio_transcript.done":
      if (ev.transcript) { addBubble("prof", ev.transcript); pushHist("assistant", ev.transcript); }
      break;
    case "error":
      console.error("Realtime error", ev.error);
      break;
  }
}

// ---------- navigation ----------
function openTopic(t) {
  state.topic = t.id;
  $("title").textContent = t.emo + " " + t.fr;
  $("log").innerHTML = "";
  loadHist().slice(-12).forEach((h) => addBubble(h.role, h.text));
  show("talk");
  hangUp();
}
$("callBtn").onclick = () => (state.live || state.pc ? hangUp() : startCall());
$("back").onclick = () => { hangUp(); state.topic = null; show("topics"); };
$("restart").onclick = () => {
  hangUp();
  localStorage.removeItem(histKey());
  $("log").innerHTML = "";
  setStatus("Leçon remise à zéro. Appuie sur Commencer.", "بدينا من الأول. ورّكي على يالاه نبداو");
};
document.addEventListener("visibilitychange", () => {
  // Si l'application passe en arrière-plan longtemps, la minuterie coupera l'appel
  if (document.visibilityState === "hidden") bumpIdle();
});

function buildTopics() {
  TOPICS.forEach((t) => {
    const b = document.createElement("button");
    b.className = "topic" + (t.wide ? " wide" : "");
    b.innerHTML = `<span class="emo">${t.emo}</span><span class="fr"></span><span class="ar"></span>`;
    b.querySelector(".fr").textContent = t.fr;
    b.querySelector(".ar").textContent = t.ar;
    b.onclick = () => openTopic(t);
    $("grid").append(b);
  });
}
async function checkCode() {
  try { await api("/api/check"); show("topics"); }
  catch (e) { if (e.message !== "code") show("topics"); }
}
$("codeBtn").onclick = async () => {
  state.code = $("codeInput").value.trim();
  localStorage.setItem("code", state.code);
  $("codeErr").textContent = "";
  await checkCode();
  if ($("code").classList.contains("on")) $("codeErr").textContent = "Code incorrect";
};
buildTopics();
setCallBtn(false);
checkCode();
</script>
</body>
</html>
