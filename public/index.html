<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5532F">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Prof Amina</title>
<style>
  :root {
    --bg: #FBF5EC;
    --card: #FFFFFF;
    --ink: #2B2420;
    --muted: #7A6E66;
    --terracotta: #B5532F;
    --terracotta-dark: #8E3E21;
    --saffron: #E8A33D;
    --teal: #1F6F6B;
    --teal-light: #E3F0EE;
    --line: #EADFD2;
    --red: #D33B2C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
    display: flex; flex-direction: column;
  }
  .ar { font-family: "Noto Naskh Arabic", "Noto Sans Arabic", system-ui, sans-serif; direction: rtl; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
    background: var(--terracotta); color: #fff;
  }
  header h1 { font-size: 22px; margin: 0; flex: 1; font-weight: 700; }
  header button {
    background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 14px;
    font-size: 22px; width: 48px; height: 48px;
  }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.on { display: flex; }

  /* Code d'accès */
  #code { justify-content: center; padding: 28px; gap: 16px; text-align: center; }
  #code input {
    font-size: 30px; text-align: center; padding: 16px; border-radius: 18px;
    border: 2px solid var(--line); background: #fff; letter-spacing: 4px;
  }
  .btn {
    font-size: 22px; font-weight: 700; padding: 18px; border: 0; border-radius: 18px;
    background: var(--teal); color: #fff;
  }
  .err { color: var(--red); min-height: 1.4em; }

  /* Choix du thème */
  #topics { overflow-y: auto; padding: 18px; }
  .hello { text-align: center; margin: 6px 0 18px; }
  .hello .fr { font-size: 24px; font-weight: 700; }
  .hello .ar { font-size: 26px; color: var(--terracotta-dark); margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .topic {
    background: var(--card); border: 2px solid var(--line); border-radius: 22px;
    padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    font: inherit; color: inherit; min-height: 150px; justify-content: center;
  }
  .topic:active { transform: scale(.97); background: var(--teal-light); }
  .topic .emo { font-size: 46px; line-height: 1; }
  .topic .fr { font-size: 18px; font-weight: 700; }
  .topic .ar { font-size: 20px; color: var(--muted); }
  .topic.wide { grid-column: 1 / -1; min-height: 110px; }

  /* Conversation */
  #talk { min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bubble {
    max-width: 88%; padding: 12px 16px; border-radius: 20px; font-size: 20px; line-height: 1.4;
    white-space: pre-wrap;
  }
  .me { align-self: flex-end; background: var(--teal); color: #fff; border-bottom-right-radius: 6px; }
  .prof { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .prof .seg { display: block; }
  .prof .seg.ar { color: var(--terracotta-dark); font-size: 22px; text-align: right; }
  .prof .seg + .seg { margin-top: 6px; }
  .controls {
    padding: 12px 18px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    background: linear-gradient(transparent, var(--bg) 25%);
  }
  #status { font-size: 19px; color: var(--muted); text-align: center; min-height: 2.6em; }
  #status .ar { display: block; font-size: 21px; }
  .row { display: flex; align-items: center; justify-content: center; gap: 22px; width: 100%; }
  .side {
    width: 82px; height: 82px; border-radius: 50%; border: 2px solid var(--line); background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 30px; color: var(--ink); padding: 0;
  }
  .side small { font-size: 13px; color: var(--muted); }
  .side:disabled { opacity: .4; }
  #mic {
    width: 132px; height: 132px; border-radius: 50%; border: 0;
    background: var(--terracotta); color: #fff; font-size: 58px;
    box-shadow: 0 8px 24px rgba(181,83,47,.35);
    position: relative;
  }
  #mic:disabled { background: #C9B8AA; box-shadow: none; }
  #mic.rec { background: var(--red); animation: pulse 1.2s infinite; }
  #mic.busy::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 5px solid transparent; border-top-color: var(--saffron); animation: spin 1s linear infinite;
  }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(211,59,44,.55)} 70%{box-shadow:0 0 0 26px rgba(211,59,44,0)} 100%{box-shadow:0 0 0 0 rgba(211,59,44,0)} }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <button id="back" aria-label="Retour" style="visibility:hidden">←</button>
  <h1 id="title">Prof Amina</h1>
  <button id="restart" aria-label="Recommencer la leçon" style="visibility:hidden">↺</button>
</header>

<!-- Écran 1 : code d'accès (demandé une seule fois) -->
<section class="screen" id="code">
  <div style="font-size:60px">🔑</div>
  <div style="font-size:20px">Code d'accès<br><span class="ar" style="font-size:22px">دخل الكود</span></div>
  <input id="codeInput" inputmode="numeric" autocomplete="off">
  <button class="btn" id="codeBtn">OK</button>
  <div class="err" id="codeErr"></div>
</section>

<!-- Écran 2 : choix du thème -->
<section class="screen" id="topics">
  <div class="hello">
    <div class="fr">Bonjour ! On apprend quoi aujourd'hui ?</div>
    <div class="ar">السلام! شنو بغيتي تتعلمي اليوم؟</div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<!-- Écran 3 : conversation -->
<section class="screen" id="talk">
  <div id="log" aria-live="polite"></div>
  <div class="controls">
    <div id="status"></div>
    <div class="row">
      <button class="side" id="again" aria-label="Répéter"><span>🔁</span><small>عاودي</small></button>
      <button id="mic" aria-label="Parler">🎤</button>
      <button class="side" id="huh" aria-label="Je n'ai pas compris"><span>❓</span><small>ما فهمتش</small></button>
    </div>
  </div>
</section>

<script>
const TOPICS = [
  { id: "presentation", emo: "👋", fr: "Me présenter", ar: "نعرّف بنفسي" },
  { id: "courses", emo: "🛒", fr: "Les courses", ar: "التقضية" },
  { id: "medecin", emo: "🩺", fr: "Le médecin", ar: "الطبيب" },
  { id: "transports", emo: "🚌", fr: "Le bus", ar: "الطوبيس" },
  { id: "administration", emo: "📄", fr: "Les papiers", ar: "الأوراق" },
  { id: "chiffres", emo: "🔢", fr: "Les chiffres", ar: "الأرقام" },
  { id: "libre", emo: "💬", fr: "Discuter", ar: "نهضرو شوية", wide: true },
];
const START_MSG = "[La leçon commence. Salue-moi chaleureusement et commence doucement.]";
const HUH_MSG = "ما فهمتش، شرحي ليا بالدارجة عافاك";

const $ = (id) => document.getElementById(id);
const state = {
  code: localStorage.getItem("code") || "",
  cloudVoice: false,
  topic: null,
  messages: [],
  lastSegments: [],
  busy: false,
  recorder: null,
};

// ---------- utilitaires ----------
function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
  const inTalk = id === "talk";
  $("back").style.visibility = inTalk ? "visible" : "hidden";
  $("restart").style.visibility = inTalk ? "visible" : "hidden";
  if (!inTalk) $("title").textContent = "Prof Amina";
}
function setStatus(fr, ar) {
  $("status").innerHTML = "";
  const a = document.createElement("span"); a.textContent = fr; $("status").append(a);
  if (ar) { const b = document.createElement("span"); b.className = "ar"; b.textContent = ar; $("status").append(b); }
}
function setBusy(b, label) {
  state.busy = b;
  $("mic").disabled = b; $("again").disabled = b || !state.lastSegments.length; $("huh").disabled = b;
  $("mic").classList.toggle("busy", b);
  if (label) setStatus(...label);
  else if (!b) setStatus("Appuie sur le micro et parle", "ورّكي على الميكرو و هضري");
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), "x-access-code": state.code } });
  if (r.status === 401) { localStorage.removeItem("code"); state.code = ""; show("code"); throw new Error("code"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r;
}
function save() {
  if (state.topic) localStorage.setItem("conv_" + state.topic, JSON.stringify(state.messages.slice(-40)));
}

// ---------- affichage ----------
function addMine(text) {
  const d = document.createElement("div"); d.className = "bubble me"; d.dir = "auto"; d.textContent = text;
  $("log").append(d); d.scrollIntoView({ behavior: "smooth", block: "end" });
}
function addProf(segments) {
  const d = document.createElement("div"); d.className = "bubble prof";
  segments.forEach((s) => {
    const e = document.createElement("span"); e.className = "seg" + (s.lang === "ar" ? " ar" : "");
    e.textContent = s.text; d.append(e);
  });
  $("log").append(d); d.scrollIntoView({ behavior: "smooth", block: "end" });
}
function segmentsOf(content) {
  try { return JSON.parse(content).segments || []; } catch { return [{ lang: "fr", text: content }]; }
}

// ---------- voix ----------
let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices(); }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang) {
  const pref = lang === "ar" ? ["ar-MA", "ar-SA", "ar-EG", "ar"] : ["fr-FR", "fr"];
  for (const p of pref) {
    const v = voices.find((v) => v.lang.replace("_", "-").toLowerCase().startsWith(p.toLowerCase()));
    if (v) return v;
  }
  return null;
}
function speakDevice(text, lang) {
  return new Promise((resolve) => {
    if (!("speechSynthesis" in window)) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "ar" ? "ar-SA" : "fr-FR";
    const v = pickVoice(lang); if (v) u.voice = v;
    u.rate = lang === "fr" ? 0.8 : 0.95;
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}
function playBlob(blob) {
  return new Promise((resolve) => {
    const a = new Audio(URL.createObjectURL(blob));
    a.onended = a.onerror = () => resolve();
    a.play().catch(() => resolve());
  });
}
async function speakAll(segments) {
  // Voix ElevenLabs si disponible : on prépare tous les sons en parallèle
  const cloud = state.cloudVoice
    ? segments.map((s) =>
        api("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(s) })
          .then((r) => r.blob()).catch(() => null))
    : [];
  for (let i = 0; i < segments.length; i++) {
    const blob = state.cloudVoice ? await cloud[i] : null;
    if (blob) await playBlob(blob);
    else await speakDevice(segments[i].text, segments[i].lang);
    await new Promise((r) => setTimeout(r, 250));
  }
}

// ---------- conversation ----------
async function askProf(userText, { hidden = false } = {}) {
  state.messages.push({ role: "user", content: userText, hidden });
  if (!hidden) addMine(userText);
  save();
  setBusy(true, ["Prof Amina réfléchit…", "الأستاذة كتفكر…"]);
  try {
    const r = await api("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: state.topic, messages: state.messages.map(({ role, content }) => ({ role, content })) }),
    });
    const { segments } = await r.json();
    state.messages.push({ role: "assistant", content: JSON.stringify({ segments }) });
    save();
    state.lastSegments = segments;
    addProf(segments);
    setBusy(true, ["Écoute bien…", "سمعي مزيان…"]);
    await speakAll(segments);
  } catch (e) {
    if (e.message !== "code") setStatus("Problème de connexion. Réessaie.", "كاين مشكل، عاودي");
    state.messages.pop(); save();
    console.error(e);
    state.busy = false; $("mic").disabled = false; $("mic").classList.remove("busy"); $("huh").disabled = false;
    return;
  }
  setBusy(false);
}

function openTopic(t) {
  state.topic = t.id;
  $("title").textContent = t.emo + " " + t.fr;
  $("log").innerHTML = "";
  state.lastSegments = [];
  state.messages = JSON.parse(localStorage.getItem("conv_" + t.id) || "[]");
  show("talk");
  for (const m of state.messages) {
    if (m.role === "assistant") { state.lastSegments = segmentsOf(m.content); addProf(state.lastSegments); }
    else if (!m.hidden) addMine(m.content);
  }
  if (!state.messages.length) askProf(START_MSG, { hidden: true });
  else { setBusy(false); speakAll(state.lastSegments); }
}

// ---------- micro ----------
async function startRec() {
  speechSynthesis.cancel();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch {
    setStatus("Autorise le micro dans les réglages.", "خصك تسمحي للميكرو");
    return;
  }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find((m) => MediaRecorder.isTypeSupported(m)) || "";
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    $("mic").classList.remove("rec"); $("mic").textContent = "🎤";
    const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
    if (blob.size < 2000) return setBusy(false);
    setBusy(true, ["J'écoute ce que tu as dit…", "كنسمع شنو قلتي…"]);
    try {
      const r = await api("/api/transcribe", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
      const { text } = await r.json();
      if (!text) { setBusy(false); setStatus("Je n'ai rien entendu. Parle plus fort.", "ما سمعت والو، هضري بصوت عالي"); return; }
      await askProf(text);
    } catch (e) {
      console.error(e);
      setBusy(false); setStatus("Problème de connexion. Réessaie.", "كاين مشكل، عاودي");
    }
  };
  rec.start();
  state.recorder = rec;
  $("mic").classList.add("rec"); $("mic").textContent = "⏹";
  setStatus("Je t'écoute… Appuie encore pour finir", "كنسمعك… ورّكي عاوتاني ملي تساليي");
  setTimeout(() => rec.state === "recording" && rec.stop(), 30000);
}

$("mic").onclick = () => {
  if (state.recorder && state.recorder.state === "recording") state.recorder.stop();
  else if (!state.busy) startRec();
};
$("again").onclick = async () => {
  if (state.busy || !state.lastSegments.length) return;
  setBusy(true, ["Écoute bien…", "سمعي مزيان…"]);
  await speakAll(state.lastSegments);
  setBusy(false);
};
$("huh").onclick = () => { if (!state.busy) askProf(HUH_MSG); };
$("back").onclick = () => {
  if (state.recorder && state.recorder.state === "recording") state.recorder.stop();
  speechSynthesis.cancel(); state.topic = null; show("topics");
};
$("restart").onclick = () => {
  if (state.busy) return;
  const t = TOPICS.find((x) => x.id === state.topic);
  localStorage.removeItem("conv_" + state.topic);
  openTopic(t);
};

// ---------- démarrage ----------
function buildTopics() {
  TOPICS.forEach((t) => {
    const b = document.createElement("button");
    b.className = "topic" + (t.wide ? " wide" : "");
    b.innerHTML = `<span class="emo">${t.emo}</span><span class="fr"></span><span class="ar"></span>`;
    b.querySelector(".fr").textContent = t.fr;
    b.querySelector(".ar").textContent = t.ar;
    b.onclick = () => openTopic(t);
    $("grid").append(b);
  });
}
async function checkCode() {
  try {
    const r = await api("/api/check");
    state.cloudVoice = !!(await r.json()).cloudVoice;
    show("topics");
  } catch (e) {
    if (e.message !== "code") { show("topics"); }
  }
}
$("codeBtn").onclick = async () => {
  state.code = $("codeInput").value.trim();
  localStorage.setItem("code", state.code);
  $("codeErr").textContent = "";
  await checkCode();
  if (!state.code || $("code").classList.contains("on")) $("codeErr").textContent = "Code incorrect";
};
buildTopics();
checkCode();
</script>
</body>
</html>
